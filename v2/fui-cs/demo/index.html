<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FuiCs demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* The theme's background, so the page does not flash another color before the first frame. */
    html { color-scheme: light dark; }
    html, body { height: 100%; overflow: hidden; background: #f8fafc; }
    @media (prefers-color-scheme: dark) { html, body { background: #040a14; } }
    .canvas-shell { position: fixed; inset: 0; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; outline: none; }
    canvas:focus, canvas:focus-visible { outline: none; }
    .effindom-loading-overlay {
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --effindom-loader-color: #38bdf8;
      --effindom-loader-background: rgba(6, 12, 21, 0.88);
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      background: linear-gradient(145deg, rgba(2, 6, 23, 0.76), rgba(15, 23, 42, 0.90));
      backdrop-filter: blur(10px);
      z-index: 2;
      color: #e2e8f0;
      opacity: 1;
      transition: opacity 140ms ease;
      cursor: default;
      user-select: none;
      -webkit-user-select: none;
    }

    .effindom-loading-overlay[hidden] { display: none; }

    .effindom-loading-card {
      max-width: 420px;
      padding: 24px 26px;
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 20px;
      background: var(--effindom-loader-background);
      text-align: center;
      box-shadow: 0 22px 60px rgba(2, 6, 23, 0.34);
    }

    .effindom-loading-visual {
      width: 88px;
      height: 64px;
      margin: 0 auto 18px;
      color: var(--effindom-loader-color);
    }

    .effindom-loading-frame {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-dasharray: 164;
      animation: effindom-loading-frame 1.8s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }

    .effindom-loading-node {
      fill: currentColor;
      transform-box: fill-box;
      transform-origin: center;
      animation: effindom-loading-node 1.8s ease-in-out infinite;
    }

    .effindom-loading-node-b { animation-delay: -0.9s; }
    .effindom-loading-overlay[data-state="error"] .effindom-loading-visual { display: none; }
    .effindom-loading-overlay[data-state="error"] .effindom-loading-card {
      border-color: rgba(248, 113, 113, 0.50);
      background: rgba(69, 10, 10, 0.86);
    }

    .effindom-loading-kicker {
      margin: 0 0 8px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #7dd3fc;
    }

    .effindom-loading-title { margin: 0; font-size: 24px; line-height: 1.2; }
    .effindom-loading-detail { margin: 10px 0 0; font-size: 14px; line-height: 1.5; color: #cbd5e1; }

    @keyframes effindom-loading-frame {
      0% { stroke-dashoffset: 164; opacity: 0.35; }
      45%, 65% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: -164; opacity: 0.35; }
    }

    @keyframes effindom-loading-node {
      0%, 100% { transform: scale(0.65); opacity: 0.35; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .effindom-loading-frame,
      .effindom-loading-node { animation: none; }
      .effindom-loading-frame { stroke-dashoffset: 0; }
    }
  </style>
</head>
<body>
  <!-- Every route serves this page; the shell loads the route's application. -->
  <div class="canvas-shell" data-effindom-canvas-size-source>
    <canvas id="fui-canvas"></canvas>
    <div
      class="effindom-loading-overlay"
      id="effindom-loading-overlay"
      data-state="loading"
      aria-live="polite"
      aria-hidden="true"
      hidden>
      <div class="effindom-loading-card">
        <svg class="effindom-loading-visual" data-effindom-loading-visual viewBox="0 0 88 64" aria-hidden="true">
          <rect class="effindom-loading-frame" x="8" y="8" width="72" height="48" rx="12" />
          <circle class="effindom-loading-node" cx="24" cy="32" r="4" />
          <circle class="effindom-loading-node effindom-loading-node-b" cx="64" cy="32" r="4" />
        </svg>
        <p class="effindom-loading-kicker">EffinDOM</p>
        <h2 class="effindom-loading-title" id="effindom-loading-title" data-effindom-loading-title>Loading application</h2>
        <p class="effindom-loading-detail" id="effindom-loading-detail" data-effindom-loading-detail>Preparing the runtime...</p>
      </div>
    </div>
    <script>
      (() => {
        const overlay = document.getElementById('effindom-loading-overlay');
        if (!(overlay instanceof HTMLElement)) return;
        const detail = document.getElementById('effindom-loading-detail');
        const state = {
          timerId: null,
          visibleAtMs: null,
          detail: 'Runtime assets',
        };
        if (detail instanceof HTMLElement) detail.textContent = state.detail;
        window.addEventListener('effindom-loading-progress', (event) => {
          if (!(event instanceof CustomEvent)) return;
          const progress = event.detail;
          if (typeof progress?.label !== 'string' || typeof progress?.completed !== 'number' || typeof progress?.total !== 'number') return;
          state.detail = `${progress.label} ${progress.completed} / ${progress.total}`;
          if (detail instanceof HTMLElement) detail.textContent = state.detail;
        });
        state.timerId = window.setTimeout(() => {
          state.timerId = null;
          state.visibleAtMs = performance.now();
          overlay.dataset.state = 'loading';
          overlay.hidden = false;
          overlay.setAttribute('aria-hidden', 'false');
        }, 300);
        window.__effindomLoadingBootstrap = state;
      })();
    </script>
  </div>
  <!-- Publishing writes this page at the demo's root and in every route's folder, so it loads the shell from the
       demo's base; a route's own relative addresses (its assets) resolve from its folder. -->
  <script src="__FUICS_ROUTE_BASE__fui-app.js"></script>
  <script src="__FUICS_ROUTE_BASE__bridge.js"></script>
  <script type="module" src="__FUICS_ROUTE_BASE__harness.js"></script>
</body>
</html>
